apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: nibas-events
  namespace: nibas
spec:
  selector:
    istio: ingressgateway # use Istio default gateway implementation
    ingress: internal
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "nibas-events.dev.skip.statkart.no"
