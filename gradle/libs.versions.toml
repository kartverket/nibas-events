[versions]
flywayVersion = "11.0.1"
kotlinMockitoVersion = "5.4.0"
kotlinPluginVersion = "2.0.20"
logstashVersion = "8.0"
prometheusVersion = "1.14.1"
springDependencyManagementVersion = "1.1.6"
springFrameworkVersion = "3.3.5"
springdocOpenapiVersion2 = "2.6.0"
testContainerVersion = "1.20.4"

[libraries]
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flywayVersion" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flywayVersion" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-mockito = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "kotlinMockitoVersion" }
kotlin-stdlib-jdk = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashVersion" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "prometheusVersion" }
postgres = { module = "org.postgresql:postgresql" }
spring-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-validator = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-web = { module = "org.springframework.boot:spring-boot-starter-web" }
springdoc-openapi-common = { module = "org.springdoc:springdoc-openapi-starter-common", version.ref = "springdocOpenapiVersion2" }
springdoc-openapi-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdocOpenapiVersion2" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapiVersion2" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testContainerVersion" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testContainerVersion" }

[plugins]
flyway = { id = "org.flywaydb.flyway", version.ref = "flywayVersion" }
kotlin-jvm = { id = "jvm", version.ref = "kotlinPluginVersion" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementVersion" }
spring-framework = { id = "org.springframework.boot", version.ref = "springFrameworkVersion" }
