version: "3.9"
services:
  vault:
    container_name: nibas-events-vault
    image: vault
    ports:
      - "8200:1234"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=myroot
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:1234
    volumes:
      - db_volume:/var/lib/postgresql
  database:
    container_name: nibas-events-db
    image: postgis/postgis
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=nibas
volumes:
  db_volume: {}

