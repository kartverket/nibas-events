name: nibas-events-dev-deploy
on: workflow_dispatch

env:
  image_name: nibas-events
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      image_tag: ${{ steps.setOutput.outputs.image_tag }}

    steps:
      - name: Set local timezone
        run: sudo timedatectl set-timezone "Europe/Oslo"
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Determine image version hash
        id: git_hash
        run: echo "git_hash=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}
          build-args: |
            project_version_arg=${{ github.ref_name }}

      - name: Set output with build values
        id: setOutput
        # Note: The image url is output in both `registry/repository:tag` and `registry/repository@digest` formats
        run: |
          echo "image_tag=${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}" >> $GITHUB_OUTPUT

  set-variables:
    runs-on: ubuntu-latest
    outputs:
      dev_auth_project_number: ${{ steps.set-dev-variables.outputs.dev_auth_project_number }}
      dev_service_account: ${{ steps.set-dev-variables.outputs.dev_service_account }}
    steps:
      - name: Set dev variables
        id: set-dev-variables
        run: |
          echo "dev_auth_project_number=747318126147" >> $GITHUB_OUTPUT
          echo "dev_service_account=nibas-deploy@nibas-dev-075c.iam.gserviceaccount.com" >> $GITHUB_OUTPUT

  deploy-argo:
    permissions:
      id-token: write
    needs: build
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@main
    with:
      application: nibas-events
      version: ${{ needs.build.outputs.image_tag }}
      deploy_dev: true
      identity: nibas


