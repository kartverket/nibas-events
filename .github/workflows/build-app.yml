name: Build app
on:
    merge_group:
    pull_request:
        branches: [main]
    workflow_call:
        inputs:
            deploy_ghcr:
                description: "Deploy to ghcr?"
                default: "false"
                type: string
        outputs:
            version:
                description: "The version of the docker-image created"
                value: ${{ jobs.build.outputs.new_tag }}
            image_url:
                description: "The full URL to the docker-image created"
                value: ${{ jobs.build.outputs.image_url }}
            digest:
                description: "The digest of the built docker image"
                value: ${{ jobs.build.outputs.digest }}

env:
    image_name: nibas-events
    registry: ghcr.io
    registry_path: kartverket

jobs:
    build:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            actions: read
            checks: write
            pull-requests: read

        outputs:
            new_tag: ${{ steps.tag_version.outputs.new_tag }}
            image_url: ${{ steps.setOutput.outputs.image_url }}
            digest: ${{ steps.setOutput.outputs.digest }}

        steps:
            - name: Set local timezone
              run: sudo timedatectl set-timezone "Europe/Oslo"

            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up JDK
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Build with Gradle
              run: ./gradlew build --info
              env:
                  JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Oslo"

            - name: Publish Test Results
              uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
              if: always()
              with:
                  files: |
                      build/test-results/test/TEST-*.xml
                      build/test-results/integrationTest/TEST-*.xml

            - name: Bump version and push tag
              id: tag_version
              uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
              with:
                  github_token: ${{ github.token }}

            - name: Login to Github Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.registry }}
                  username: ${{ github.actor }}
                  password: ${{ github.token }}

            - name: Build docker and push
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  push: ${{ inputs.deploy_ghcr == 'true' }}
                  tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }} , ${{ env.registry }}/${{ github.repository }}:latest
                  build-args: |
                      project_version_arg=${{ steps.tag_version.outputs.new_tag }}

            - name: Set output with build values
              id: setOutput
              run: |
                  echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
                  echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
