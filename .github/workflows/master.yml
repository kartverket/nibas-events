name: nibas-master
#on:
#  push:
#    branches: [ master ]

on:
  push:
    branches-ignore:
      - 'master'

permissions:
  id-token: write
  contents: 'read'

env:
  image_name: nibas-events
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Europe/Oslo"
      - uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ github.token }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password:  ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }}
          build-args: | 
            project_version_arg=${{ steps.tag_version.outputs.new_tag }}

      - name: Run Trivy vulnerability scanner
        id: securityscan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-dev:
    needs: build
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v2.7.5
    with:
      runner: atkv1-dev
      environment: dev
      kubernetes_cluster: atkv1-dev
      terraform_workspace: dev
      terraform_options: -var-file=variables/dev.tfvars -var=NIBAS_EVENTS_VERSION=${{ needs.build.outputs.new_tag }}
      terraform_backend_config: -backend-config=backend/dev.gcs.tfbackend
      working_directory: terraform
      workload_identity_provider: projects/747318126147/locations/global/workloadIdentityPools/nibas-deploy-pool/providers/github-provider
      service_account: nibas-deploy@nibas-dev-075c.iam.gserviceaccount.com
      vault_role: nibas-events-write-role
      project_id: kubernetes-dev-94b9
      deploy_on: 'refs/heads/TS-553-Skiperator'
#      deploy_on: 'refs/heads/master'
