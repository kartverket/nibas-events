name: nibas-master
on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: 'read'

env:
  image_name: nibas-events
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      image_url: ${{ steps.setOutput.outputs.image_url }}

    steps:
      - name: Set local timezone
        run: sudo timedatectl set-timezone "Europe/Oslo"
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ github.token }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }}
          build-args: |
            project_version_arg=${{ steps.tag_version.outputs.new_tag }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  set-variables:
    runs-on: ubuntu-latest
    outputs:
      dev_auth_project_number: ${{ steps.set-dev-variables.outputs.dev_auth_project_number }}
      dev_service_account: ${{ steps.set-dev-variables.outputs.dev_service_account }}
    steps:
      - name: Set dev variables
        id: set-dev-variables
        run: |
          echo "dev_auth_project_number=747318126147" >> $GITHUB_OUTPUT
          echo "dev_service_account=nibas-deploy@nibas-dev-075c.iam.gserviceaccount.com" >> $GITHUB_OUTPUT

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@v0.5.0
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-argo:
    permissions:
      id-token: write
    needs: [ pharos, build ]
    uses: kartverket/smia-apps/.github/workflows/release-app-octo-sts.yml@main
    with:
      application: nibas-events
      version: ${{ needs.build.outputs.new_tag }}
      deploy_dev: true
      deploy_prod: true
      identity: nibas
