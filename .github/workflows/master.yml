name: nibas-master
on:
  push:
    branches: [ master ]

permissions:
  id-token: write
  contents: 'read'

env:
  image_name: nibas-events
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      image_url: ${{ steps.setOutput.outputs.image_url }}

    steps:
      - uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Europe/Oslo"
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build --info

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password:  ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }}
          build-args: | 
            project_version_arg=${{ steps.tag_version.outputs.new_tag }}

      - name: Set output with build values
        id: setOutput
        run: |
            echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  set-variables:
    runs-on: ubuntu-latest
    outputs:
      dev_auth_project_number: ${{ steps.set-dev-variables.outputs.dev_auth_project_number }}
      dev_service_account: ${{ steps.set-dev-variables.outputs.dev_service_account }}
    steps:
      - name: Set dev variables
        id: set-dev-variables
        run: |
          echo "dev_auth_project_number=747318126147" >> $GITHUB_OUTPUT
          echo "dev_service_account=nibas-deploy@nibas-dev-075c.iam.gserviceaccount.com" >> $GITHUB_OUTPUT

  deploy-argo:
    needs: build
    uses: kartverket/smia-apps/.github/workflows/release-app.yml@main
    with:
      application: nibas-events
      version: ${{ needs.build.outputs.new_tag }}
      deploy_dev: true
      deploy_test: true
      deploy_prod: true
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_ARGOCD }}

  security-scans:
    needs: [ build, set-variables ]
    name: Security Scans
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
      security-events: write
    uses: kartverket/github-workflows/.github/workflows/run-security-scans.yml@v4.0.0
    with:
      auth_project_number: ${{ needs.set-variables.outputs.dev_auth_project_number}}
      service_account: ${{ needs.set-variables.outputs.dev_service_account}}
      image_url: ${{ needs.build.outputs.image_url}}

